<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>BACKROOMS // SURVIVAL</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

/* =========================
INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    background:
    radial-gradient(circle,#2d290e,#090806 60%,#000);
}

.introBox{
    width:90%;
    max-width:700px;
}

.logo{
    font-size:clamp(45px,11vw,110px);
    letter-spacing:12px;
    color:#dfd06b;
    text-shadow:
    3px 0 red,
    -3px 0 cyan;
    animation:glitch 2s infinite;
}

.introSub{
    color:#888;
    letter-spacing:4px;
    margin-top:15px;
    font-size:12px;
}

.bigButton{
    margin-top:45px;
    padding:18px 55px;
    background:rgba(255,220,80,.08);
    border:1px solid #aaa;
    color:white;
    cursor:pointer;
    letter-spacing:5px;
    font-weight:bold;
}

.bigButton:hover{
    background:#d5c44c;
    color:#111;
    box-shadow:0 0 40px #d5c44c;
}

.saveText{
    margin-top:20px;
    color:#555;
    font-size:10px;
    letter-spacing:2px;
}

@keyframes glitch{
    0%,90%,100%{transform:translate(0)}
    92%{transform:translate(-5px,2px)}
    95%{transform:translate(5px,-2px)}
}

/* =========================
HUD
========================= */

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 4px #000;
}

.level{
    position:absolute;
    top:20px;
    left:20px;
    font-size:22px;
    letter-spacing:4px;
}

.objective{
    position:absolute;
    top:55px;
    left:20px;
    font-size:11px;
    color:#ddd;
}

.status{
    position:absolute;
    top:20px;
    right:20px;
    text-align:right;
    font-size:10px;
    color:#aaa;
}

#healthBox{
    position:absolute;
    left:20px;
    bottom:25px;
    width:190px;
}

.label{
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.bar{
    width:100%;
    height:8px;
    background:rgba(255,255,255,.15);
}

#health{
    width:100%;
    height:100%;
    background:#bd3333;
}

#stamina{
    width:100%;
    height:100%;
    background:#d6c75d;
}

.barSpace{
    margin-top:12px;
}

/* =========================
CENTER MESSAGE
========================= */

#message{
    position:fixed;
    z-index:40;
    left:50%;
    top:20%;
    transform:translateX(-50%);
    color:white;
    font-size:13px;
    letter-spacing:4px;
    opacity:0;
    transition:opacity .5s;
    pointer-events:none;
    text-align:center;
}

/* =========================
CROSSHAIR
========================= */

#crosshair{
    position:fixed;
    z-index:25;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:12px;
    height:12px;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    opacity:.8;
}

#crosshair:before{
    width:12px;
    height:1px;
    top:5px;
}

#crosshair:after{
    height:12px;
    width:1px;
    left:5px;
}

/* =========================
MOBILE
========================= */

#mobile{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:30px;
    width:125px;
    height:125px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.2);
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:37px;
    top:37px;
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
}

.mButton{
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.35);
    color:white;
    font-size:9px;
    pointer-events:auto;
}

#runBtn{
    right:25px;
    bottom:35px;
}

#flashBtn{
    right:100px;
    bottom:105px;
}

#interactBtn{
    right:25px;
    bottom:110px;
}

#crosshairMobile{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:7px;
    height:7px;
    border:1px solid white;
    border-radius:50%;
}

/* =========================
VHS
========================= */

#vhs{
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
    display:none;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.025) 0px,
        rgba(255,255,255,.025) 1px,
        transparent 1px,
        transparent 4px
    );
}

#vignette{
    position:fixed;
    inset:0;
    z-index:29;
    pointer-events:none;
    display:none;
    background:
    radial-gradient(
        ellipse at center,
        transparent 42%,
        rgba(0,0,0,.75)
    );
}

/* =========================
INVENTORY
========================= */

#inventory{
    position:fixed;
    right:20px;
    bottom:25px;
    z-index:25;
    color:white;
    font-size:11px;
    letter-spacing:2px;
    text-align:right;
}

/* =========================
DEATH
========================= */

#death{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    justify-content:center;
    align-items:center;
    background:#050000;
    color:white;
    text-align:center;
}

.deathTitle{
    font-size:clamp(55px,12vw,120px);
    letter-spacing:12px;
    color:#a00;
}

.deathText{
    margin-top:15px;
    color:#777;
    letter-spacing:3px;
}

#restart{
    margin-top:40px;
}

/* =========================
LEVEL SCREEN
========================= */

#levelScreen{
    position:fixed;
    inset:0;
    z-index:600;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    color:white;
    text-align:center;
}

.levelNumber{
    font-size:clamp(60px,15vw,150px);
    letter-spacing:15px;
}

.levelDesc{
    color:#777;
    letter-spacing:4px;
    margin-top:15px;
}

/* =========================
JUMPSCARE
========================= */

#jumpscare{
    position:fixed;
    inset:0;
    z-index:800;
    display:none;
    background:#000;
    align-items:center;
    justify-content:center;
}

.scareFace{
    width:45vw;
    max-width:400px;
    aspect-ratio:1;
    border-radius:50%;
    background:#050505;
    position:relative;
    box-shadow:
    0 0 100px #900,
    inset 0 0 80px #000;
}

.eye{
    position:absolute;
    width:18%;
    height:10%;
    background:#ddd;
    border-radius:50%;
    top:35%;
}

.eye.left{
    left:20%;
}

.eye.right{
    right:20%;
}

.mouth{
    position:absolute;
    width:55%;
    height:25%;
    left:22.5%;
    bottom:18%;
    border-radius:0 0 50% 50%;
    background:#900;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:800px){

    #crosshair{
        display:none;
    }

    #mobile{
        display:block;
    }

    .level{
        top:12px;
        left:12px;
        font-size:16px;
    }

    .objective{
        top:40px;
        left:12px;
    }

    .status{
        top:12px;
        right:12px;
    }

    #healthBox{
        left:20px;
        bottom:180px;
        width:130px;
    }

    #inventory{
        bottom:185px;
        right:20px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- INTRO -->

<div id="intro">

<div class="introBox">

<div class="logo">BACKROOMS</div>

<div class="introSub">
SURVIVAL // LEVEL 0
</div>

<button id="start" class="bigButton">
OYUNA BAŞLA
</button>

<div class="saveText">
KAYIT SİSTEMİ AKTİF
</div>

</div>

</div>


<!-- HUD -->

<div id="hud">

<div class="level" id="levelText">
LEVEL 0
</div>

<div class="objective" id="objective">
ÇIKIŞI BUL
</div>

<div class="status">
SIGNAL: LOST<br>
CAM: UNKNOWN
</div>

<div id="crosshair"></div>

<div id="healthBox">

HEALTH

<div class="bar">
<div id="health"></div>
</div>

<div class="label barSpace">
STAMINA

<div class="bar">
<div id="stamina"></div>

<script type="module">

import * as THREE from "three";

import {
PointerLockControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";


/* =========================================================
GAME STATE
========================================================= */

let currentLevel =
Number(localStorage.getItem("backroomsLevel") || 0);

let hasKey =
localStorage.getItem("backroomsKey")==="true";

let health=100;
let stamina=100;

let gameStarted=false;
let dead=false;

let flashlightOn=true;

let entityActive=false;
let entityChasing=false;

let levelTransition=false;

let audio=null;


/* =========================================================
THREE
========================================================= */

const scene=
new THREE.Scene();

const camera=
new THREE.PerspectiveCamera(
75,
innerWidth/innerHeight,
.1,
500
);

camera.position.set(
0,1.7,0
);


const renderer=
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document
.getElementById("game")
.appendChild(renderer.domElement);


/* =========================================================
FOG
========================================================= */

scene.background=
new THREE.Color(0x15130a);

scene.fog=
new THREE.FogExp2(
0x25210e,
.018
);


/* =========================================================
LIGHT
========================================================= */

const ambient=
new THREE.HemisphereLight(
0xffefaa,
0x111111,
1.4
);

scene.add(ambient);


/* =========================================================
WORLD ARRAYS
========================================================= */

let walls=[];
let lights=[];
let keysObjects=[];

let exitDoor=null;

let entity=null;


/* =========================================================
CLEAR LEVEL
========================================================= */

function clearLevel(){

walls.forEach(w=>{
scene.remove(w);
});

lights.forEach(l=>{
scene.remove(l.group);
});

keysObjects.forEach(k=>{
scene.remove(k);
});

if(exitDoor){
scene.remove(exitDoor);
exitDoor=null;
}

if(entity){
scene.remove(entity);
entity=null;
}

walls=[];
lights=[];
keysObjects=[];
}


/* =========================================================
MATERIALS
========================================================= */

const wallMat=
new THREE.MeshStandardMaterial({
color:0xb6a847,
roughness:.95
});

const floorMat=
new THREE.MeshStandardMaterial({
color:0x77702e,
roughness:1
});

const darkWallMat=
new THREE.MeshStandardMaterial({
color:0x292929,
roughness:1
});


/* =========================================================
WALL
========================================================= */

function wall(
x,z,w,d,
material=wallMat
){

const obj=
new THREE.Mesh(
new THREE.BoxGeometry(
w,4,d
),
material
);

obj.position.set(
x,2,z
);

obj.castShadow=true;
obj.receiveShadow=true;

scene.add(obj);

walls.push(obj);

return obj;
}


/* =========================================================
LIGHT
========================================================= */

function createLight(x,z){

const group=
new THREE.Group();

const lamp=
new THREE.Mesh(
new THREE.BoxGeometry(
2.4,.08,.3
),
new THREE.MeshBasicMaterial({
color:0xffffff
})
);

lamp.position.y=3.9;

group.add(lamp);

const point=
new THREE.PointLight(
0xfff0a0,
4,
16
);

point.position.y=3.5;

group.add(point);

group.position.set(
x,0,z
);

scene.add(group);

lights.push({
group,
light:point
});

}


/* =========================================================
FLOOR
========================================================= */

function createFloor(){

const floor=
new THREE.Mesh(
new THREE.PlaneGeometry(
300,300
),
floorMat
);

floor.rotation.x=-Math.PI/2;

scene.add(floor);

}


/* =========================================================
LEVEL 0
========================================================= */

function buildLevel0(){

clearLevel();

createFloor();

scene.background=
new THREE.Color(0x15130a);

scene.fog=
new THREE.FogExp2(
0x25210e,
.018
);

camera.position.set(
0,1.7,0
);

camera.rotation.set(0,0,0);


/* OUTER WALLS */

wall(0,-40,80,1);
wall(0,40,80,1);
wall(-40,0,1,80);
wall(40,0,1,80);


/* MAZE */

wall(-20,-15,1,30);
wall(10,-20,1,35);

wall(20,5,25,1);
wall(-20,15,25,1);

wall(0,5,1,20);
wall(15,25,1,20);

wall(-10,30,30,1);
wall(-25,-5,20,1);

wall(25,-25,20,1);
wall(-5,-30,1,15);

wall(8,12,20,1);


/* LIGHTS */

for(
let x=-30;
x<=30;
x+=15
){

for(
let z=-30;
z<=30;
z+=15
){

createLight(x,z);

}

}


/* KEY */

createKey(
-25,
25
);


/* EXIT */

createExit(
30,
-30
);


/* ENTITY */

createEntity(
25,
25
);


/* OBJECTIVE */

document
.getElementById("objective")
.innerText=
hasKey
?"KAPIYA GİT"
:"ANAHTARI BUL";


updateInventory();

}


/* =========================================================
LEVEL 1
========================================================= */

function buildLevel1(){

clearLevel();

createFloor();

scene.background=
new THREE.Color(0x080808);

scene.fog=
new THREE.FogExp2(
0x090909,
.025
);

camera.position.set(
0,1.7,0
);

camera.rotation.set(
0,0,0
);


/* OUTER */

wall(
0,-45,
90,1,
darkWallMat
);

wall(
0,45,
90,1,
darkWallMat
);

wall(
-45,0,
1,90,
darkWallMat
);

wall(
45,0,
1,90,
darkWallMat
);


/* ROOMS */

wall(-15,-15,1,30,darkWallMat);
wall(15,-15,1,30,darkWallMat);

wall(-15,15,30,1,darkWallMat);
wall(15,25,30,1,darkWallMat);

wall(-30,0,20,1,darkWallMat);
wall(30,-5,20,1,darkWallMat);

wall(0,30,1,25,darkWallMat);
wall(0,-30,1,25,darkWallMat);


/* LIGHTS */

for(
let x=-30;
x<=30;
x+=15
){

for(
let z=-30;
z<=30;
z+=15
){

createLight(x,z);

}

}


/* KEY */

createKey(
25,
-30
);


/* EXIT */

createExit(
-30,
30
);


/* ENTITY */

createEntity(
25,
25
);


/* OBJECTIVE */

document
.getElementById("objective")
.innerText=
hasKey
?"LEVEL 1 ÇIKIŞINA GİT"
:"ANAHTARI BUL";

updateInventory();

}


/* =========================================================
KEY
========================================================= */

function createKey(x,z){

const key=
new THREE.Group();

const ring=
new THREE.Mesh(
new THREE.TorusGeometry(
.18,.045,8,16
),
new THREE.MeshBasicMaterial({
color:0xffd83d
})
);

ring.rotation.x=
Math.PI/2;

key.add(ring);


const stem=
new THREE.Mesh(
new THREE.BoxGeometry(
.06,.35,.06
),
new THREE.MeshBasicMaterial({
color:0xffd83d
})
);

stem.position.y=-.15;

key.add(stem);

key.position.set(
x,
1.2,
z
);

scene.add(key);

keysObjects.push(key);

}


/* =========================================================
EXIT
========================================================= */

function createExit(x,z){

const material=
new THREE.MeshStandardMaterial({
color:0x141414,
roughness:.7
});

exitDoor=
new THREE.Mesh(
new THREE.BoxGeometry(
2.2,3.7,.4
),
material
);

exitDoor.position.set(
x,
1.85,
z
);

scene.add(exitDoor);


/* SIGN */

const sign=
new THREE.Mesh(
new THREE.BoxGeometry(
1.4,.3,.05
),
new THREE.MeshBasicMaterial({
color:0xff2020
})
);

sign.position.set(
x,
3.8,
z-.25
);

scene.add(sign);

}


/* =========================================================
ENTITY
========================================================= */

function createEntity(x,z){

entity=
new THREE.Group();

const material=
new THREE.MeshBasicMaterial({
color:0x010101
});

const body=
new THREE.Mesh(
new THREE.CylinderGeometry(
.4,.55,2.5,8
),
material
);

body.position.y=1.25;

entity.add(body);


const head=
new THREE.Mesh(
new THREE.SphereGeometry(
.42,12,12
),
material
);

head.position.y=2.8;

entity.add(head);


entity.position.set(
x,0,z
);

entity.visible=false;

scene.add(entity);

}


/* =========================================================
AUDIO
========================================================= */

function startAudio(){

if(audio)return;

try{

audio=
new (
window.AudioContext ||
window.webkitAudioContext
)();

const oscillator=
audio.createOscillator();

const gain=
audio.createGain();

oscillator.type="sine";

oscillator.frequency.value=58;

gain.gain.value=.018;

oscillator.connect(gain);

gain.connect(
audio.destination
);

oscillator.start();

}catch(e){}

}


/* =========================================================
SOUND
========================================================= */

function beep(freq=200,duration=.1){

if(!audio)return;

const osc=
audio.createOscillator();

const gain=
audio.createGain();

osc.frequency.value=freq;

gain.gain.value=.06;

osc.connect(gain);
gain.connect(audio.destination);

osc.start();

osc.stop(
audio.currentTime+duration
);

}


/* =========================================================
FLASHLIGHT
========================================================= */

const flashlight=
new THREE.SpotLight(
0xffffff,
20,
35,
Math.PI/7,
.5,
1
);

camera.add(flashlight);

scene.add(camera);


function toggleFlashlight(){

flashlightOn=!flashlightOn;

flashlight.intensity=
flashlightOn?20:0;

beep(
flashlightOn?500:150,
.06
);

}


/* =========================================================
CONTROLS
========================================================= */

const controls=
new PointerLockControls(
camera,
document.body
);

let keys={
w:false,
a:false,
s:false,
d:false,
shift:false
};

window.addEventListener(
"keydown",
e=>{

if(e.code==="KeyW")keys.w=true;
if(e.code==="KeyA")keys.a=true;
if(e.code==="KeyS")keys.s=true;
if(e.code==="KeyD")keys.d=true;

if(
e.code==="ShiftLeft"||
e.code==="ShiftRight"
)
keys.shift=true;

if(e.code==="KeyF")
toggleFlashlight();

if(e.code==="KeyE")
interact();

});


window.addEventListener(
"keyup",
e=>{

if(e.code==="KeyW")keys.w=false;
if(e.code==="KeyA")keys.a=false;
if(e.code==="KeyS")keys.s=false;
if(e.code==="KeyD")keys.d=false;

if(
e.code==="ShiftLeft"||
e.code==="ShiftRight"
)
keys.shift=false;

});


/* =========================================================
MOBILE
========================================================= */

let mobileForward=0;
let mobileSide=0;
let mobileRun=false;

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

let joystickActive=false;

joystick.addEventListener(
"touchstart",
e=>{
joystickActive=true;
e.preventDefault();
},
{passive:false}
);

joystick.addEventListener(
"touchmove",
e=>{

if(!joystickActive)return;

e.preventDefault();

const rect=
joystick.getBoundingClientRect();

const touch=e.touches[0];

let x=
touch.clientX-
(rect.left+rect.width/2);

let y=
touch.clientY-
(rect.top+rect.height/2);

const max=40;

const dist=
Math.sqrt(x*x+y*y);

if(dist>max){

x=x/dist*max;
y=y/dist*max;

}

stick.style.transform=
`translate(${x}px,${y}px)`;

mobileSide=x/max;
mobileForward=-y/max;

},
{passive:false}
);

joystick.addEventListener(
"touchend",
()=>{

joystickActive=false;

mobileSide=0;
mobileForward=0;

stick.style.transform=
"translate(0,0)";

}
);


/* RUN */

const runBtn=
document.getElementById("runBtn");

runBtn.addEventListener(
"touchstart",
()=>{
mobileRun=true;
}
);

runBtn.addEventListener(
"touchend",
()=>{
mobileRun=false;
}
);


/* FLASH */

document
.getElementById("flashBtn")
.addEventListener(
"touchstart",
toggleFlashlight
);


/* INTERACT */

document
.getElementById("interactBtn")
.addEventListener(
"touchstart",
interact
);


/* MOBILE LOOK */

let lookTouch=null;

renderer.domElement.addEventListener(
"touchstart",
e=>{

if(e.touches.length!==1)return;

const t=e.touches[0];

if(
t.clientX>
innerWidth/2
){

lookTouch={
x:t.clientX,
y:t.clientY
};

}

},
{passive:false}
);

renderer.domElement.addEventListener(
"touchmove",
e=>{

if(!lookTouch)return;

e.preventDefault();

const t=e.touches[0];

const dx=
t.clientX-lookTouch.x;

const dy=
t.clientY-lookTouch.y;

camera.rotation.y-=
dx*.003;

camera.rotation.x-=
dy*.003;

camera.rotation.x=
Math.max(
-Math.PI/2,
Math.min(
Math.PI/2,
camera.rotation.x
)
);

lookTouch={
x:t.clientX,
y:t.clientY
};

},
{passive:false}
);

renderer.domElement.addEventListener(
"touchend",
()=>{
lookTouch=null;
}
);


/* =========================================================
INTERACT
========================================================= */

function interact(){

if(!gameStarted)return;

if(!exitDoor)return;

const distance=
camera.position.distanceTo(
exitDoor.position
);

if(distance<3){

if(hasKey){

beep(800,.2);

nextLevel();

}else{

showMessage(
"ÖNCE ANAHTARI BUL."
);

beep(100,.15);

}

}

}


/* =========================================================
KEY PICKUP
========================================================= */

function checkKeys(){

for(
let i=keysObjects.length-1;
i>=0;
i--
){

const key=
keysObjects[i];

const distance=
camera.position.distanceTo(
key.position
);

if(distance<1.5){

hasKey=true;

localStorage.setItem(
"backroomsKey",
"true"
);

scene.remove(key);

keysObjects.splice(i,1);

updateInventory();

document
.getElementById("objective")
.innerText=
"KAPIYA GİT";

showMessage(
"ANAHTAR BULUNDU"
);

beep(800,.2);

}

}

}


/* =========================================================
INVENTORY
========================================================= */

function updateInventory(){

document
.getElementById("inventory")
.innerText=
"KEY: "+
(hasKey?"YES":"NO");

}


/* =========================================================
ENTITY AI
========================================================= */

let entityTimer=0;

function updateEntity(delta){

if(!entity)return;

entityTimer+=delta;


/* RANDOM APPEAR */

if(!entityChasing && entityTimer>12){

entityTimer=0;

if(Math.random()<.6){

const angle=
Math.random()*Math.PI*2;

entity.position.x=
camera.position.x+
Math.cos(angle)*18;

entity.position.z=
camera.position.z+
Math.sin(angle)*18;

entity.visible=true;

entityActive=true;

showMessage(
"ARKANDA BİR ŞEY VAR..."
);

}

}


/* CHASE */

if(entity.visible){

const distance=
entity.position.distanceTo(
camera.position
);

if(distance<14){

entityChasing=true;

}

if(entityChasing){

const direction=
new THREE.Vector3();

direction.subVectors(
camera.position,
entity.position
);

direction.y=0;

direction.normalize();

entity.position.addScaledVector(
direction,
delta*2.2
);

entity.lookAt(
camera.position.x,
1.5,
camera.position.z
);


/* PLAYER LOOKS */

if(distance<2){

damage(100);

}

}else{

if(distance>25){

entity.visible=false;
entityActive=false;

}

}

}

}


/* =========================================================
DAMAGE
========================================================= */

function damage(amount){

if(dead)return;

health-=amount;

health=
Math.max(0,health);

document
.getElementById("health")
.style.width=
health+"%";

if(health<=0){

die();

}

}


/* =========================================================
DEATH
========================================================= */

function die(){

dead=true;
gameStarted=false;

if(
document.pointerLockElement
){
document.exitPointerLock();
}

document
.getElementById("death")
.style.display="flex";

beep(70,.5);

}


/* =========================================================
JUMPSCARE
========================================================= */

function jumpscare(){

const el=
document.getElementById(
"jumpscare"
);

el.style.display="flex";

beep(40,.6);

setTimeout(()=>{

el.style.display="none";

damage(30);

},700);

}


/* =========================================================
LEVEL CHANGE
========================================================= */

function nextLevel(){

if(levelTransition)return;

levelTransition=true;

gameStarted=false;

document
.getElementById("levelScreen")
.style.display="flex";

currentLevel++;

localStorage.setItem(
"backroomsLevel",
currentLevel
);

setTimeout(()=>{

document
.getElementById("nextLevel")
.innerText=
"LEVEL "+
currentLevel;

},100);


setTimeout(()=>{

document
.getElementById("levelScreen")
.style.display="none";

health=100;
stamina=100;

entityChasing=false;
entityActive=false;

if(currentLevel===1){

buildLevel1();

}else{

/*
Level 2 için şimdilik
Level 1 tekrar kullanılacak.
Daha sonra tamamen farklı
harita ekleyebiliriz.
*/

buildLevel1();

}

gameStarted=true;

levelTransition=false;

showMessage(
"LEVEL "+currentLevel
);

},2500);

}


/* =========================================================
MOVEMENT
========================================================= */

function updateMovement(delta){

let forward=0;
let side=0;

if(keys.w)forward++;
if(keys.s)forward--;

if(keys.a)side--;
if(keys.d)side++;

forward+=mobileForward;
side+=mobileSide;

const moving=
Math.abs(forward)>.05||
Math.abs(side)>.05;

let running=
keys.shift||
mobileRun;

if(
running &&
moving &&
stamina>0
){

stamina-=35*delta;

}else{

stamina+=22*delta;

}

stamina=
Math.max(
0,
Math.min(
100,
stamina
)
);

document
.getElementById("stamina")
.style.width=
stamina+"%";

if(stamina<=0)
running=false;

const speed=
running?6:3.2;

if(moving){

const direction=
new THREE.Vector3(
side,
0,
-forward
);

direction.applyQuaternion(
camera.quaternion
);

direction.y=0;

direction.normalize();

camera.position.addScaledVector(
direction,
speed*delta
);

camera.position.y=1.7;


/* FOOTSTEP */

if(
Math.random()<delta*5
){
beep(
running?100:70,
.025
);
}

}

}


/* =========================================================
LIGHT FLICKER
========================================================= */

function flickerLights(){

lights.forEach(item=>{

if(Math.random()<.015){

const old=
item.light.intensity;

item.light.intensity=0;

setTimeout(()=>{

item.light.intensity=
old;

},50+Math.random()*250);

}

});

}


/* =========================================================
RANDOM HORROR
========================================================= */

let horrorTimer=0;

function horrorEvents(delta){

horrorTimer+=delta;

if(horrorTimer>18){

horrorTimer=0;

const r=Math.random();

if(r<.25){

showMessage(
"BURADA YALNIZ DEĞİLSİN."
);

}

else if(r<.5){

jumpscare();

}

else if(r<.75){

entity.visible=true;

entity.position.set(
camera.position.x+12,
0,
camera.position.z+12
);

showMessage(
"ARKANA BAKMA."
);

}

}

}


/* =========================================================
MESSAGE
========================================================= */

function showMessage(text){

const m=
document.getElementById("message");

m.innerText=text;

m.style.opacity=1;

setTimeout(()=>{

m.style.opacity=0;

},3000);

}


/* =========================================================
EXIT COLLISION
========================================================= */

function checkExit(){

if(!exitDoor)return;

const distance=
camera.position.distanceTo(
exitDoor.position
);

if(distance<2.5){

if(hasKey){

showMessage(
"ETKİLEŞİM: E"
);

}else{

showMessage(
"KAPI KİLİTLİ"
);

}

}

}


/* =========================================================
START
========================================================= */

document
.getElementById("start")
.addEventListener(
"click",
()=>{

document
.getElementById("intro")
.style.display="none";

document
.getElementById("hud")
.style.display="block";

document
.getElementById("vhs")
.style.display="block";

document
.getElementById("vignette")
.style.display="block";

startAudio();

if(innerWidth>800){

controls.lock();

}else{

document
.getElementById("mobile")
.style.display="block";

}

gameStarted=true;

showMessage(
"LEVEL "+
currentLevel+
" // BAŞLADI"
);

}
);


/* =========================================================
RESTART
========================================================= */

document
.getElementById("restart")
.addEventListener(
"click",
()=>{

health=100;
stamina=100;

dead=false;

entityChasing=false;
entityActive=false;

document
.getElementById("death")
.style.display="none";

if(currentLevel===0){

buildLevel0();

}else{

buildLevel1();

}

gameStarted=true;

showMessage(
"TEKRAR BAŞLADI"
);

}
);


/* =========================================================
RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);


/* =========================================================
INITIAL LEVEL
========================================================= */

if(currentLevel===0){

buildLevel0();

}else{

buildLevel1();

}


/* =========================================================
GAME LOOP
========================================================= */

const clock=
new THREE.Clock();

function animate(){

requestAnimationFrame(
animate
);

const delta=
Math.min(
clock.getDelta(),
.05
);

if(gameStarted && !dead){

updateMovement(delta);

updateEntity(delta);

checkKeys();

checkExit();

flickerLights();

horrorEvents(delta);


/* HEAD BOB */

if(
keys.w||
keys.s||
mobileForward
){

camera.position.y=
1.7+
Math.sin(
performance.now()*.012
)*.025;

}

}

renderer.render(
scene,
camera
);

}

animate();

</script>
